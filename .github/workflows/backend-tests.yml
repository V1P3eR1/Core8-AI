name: backend-tests

on:
  pull_request:
    paths:
      - "apps/core8-platform/backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main]
    paths:
      - "apps/core8-platform/backend/**"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/core8-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/core8-platform/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
