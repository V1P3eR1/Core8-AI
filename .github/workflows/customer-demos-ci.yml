name: customer-demos-ci

on:
  pull_request:
    paths:
      - "apps/customer-demos/**"
      - "docs/customer-showcase/**"
      - ".github/workflows/customer-demos-ci.yml"
  push:
    branches:
      - "docs/customer-showcase-kit"
    paths:
      - "docs/customer-showcase/**"
      - ".github/workflows/customer-demos-ci.yml"

permissions:
  contents: read

jobs:
  offline-demo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify receptionist logic and local-only demo code
        working-directory: apps/customer-demos
        env:
          TZ: Asia/Jerusalem
        run: |
          npm test
          node --check receptionist/app.js
          node --check receptionist/engine.js
          node --check receptionist/i18n.js
      - name: Verify showcase content, links and unpublished calendar
        working-directory: docs/customer-showcase
        run: |
          node --test test_showcase.cjs
      - name: Browser coverage disclosure
        run: |
          echo 'Offline unit and static content contracts only. Browser visual/mobile/RTL smoke tests remain NOT VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public publishing, paid AI services, real calendar integration or deployment.' >> "$GITHUB_STEP_SUMMARY"
