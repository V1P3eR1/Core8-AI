name: Handoff contract tests
on:
  pull_request:
    paths: ['tools/handoff/**', '.github/workflows/*sync*', '.github/workflows/claude-issues.yml', '.github/workflows/handoff-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/handoff -p 'test_*.py' -v
