name: Handoff contract tests
on:
  pull_request:
    paths: ['tools/handoff/**', '.github/workflows/*sync*', '.github/workflows/claude-issues.yml', '.github/workflows/handoff-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/handoff -p 'test_*.py' -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: core8_ci
          POSTGRES_PASSWORD: ci_local_test_only
          POSTGRES_DB: core8_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U core8_ci -d core8_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORE8_TEST_PG_DSN: postgresql://core8_ci:ci_local_test_only@127.0.0.1:5432/core8_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL test client
        run: python -m pip install 'psycopg[binary]==3.2.9'
      - name: Live PostgreSQL replay tests
        run: python -m unittest discover -s tools/handoff -p 'test_postgres_live.py' -v
