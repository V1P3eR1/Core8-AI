name: customer-showcase-contract

on:
  pull_request:
    paths:
      - "docs/customer-showcase/**"
      - ".github/workflows/customer-showcase-contract.yml"
  push:
    branches:
      - "docs/customer-showcase-kit"
    paths:
      - "docs/customer-showcase/**"
      - ".github/workflows/customer-showcase-contract.yml"

permissions:
  contents: read

jobs:
  offline-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify unpublished bilingual static assets
        working-directory: docs/customer-showcase
        run: node --test test_showcase.cjs
      - name: Note outstanding browser acceptance
        run: |
          echo 'Five offline showcase contracts tested. Desktop/mobile/RTL visual browser acceptance remains NOT VERIFIED.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No publication, calendar import, messaging, deployment or paid AI calls.' >> "$GITHUB_STEP_SUMMARY"
