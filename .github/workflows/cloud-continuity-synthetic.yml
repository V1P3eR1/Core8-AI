name: cloud-continuity-synthetic-contract

# Review-only proposal. This is not an always-on orchestrator.
# No secrets, external API calls, deployment or paid AI use.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/test_cloud_continuity.py'
      - 'tools/handoff/**'
      - '.github/workflows/cloud-continuity-synthetic.yml'

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run synthetic offline continuity tests
        run: python3 -m unittest discover -s tests -p 'test_cloud_continuity.py' -v
      - name: Run Notion GitHub bridge contract and dry-run tests (offline)
        run: python3 -m unittest discover -s tools/handoff -p 'test_*.py' -v
