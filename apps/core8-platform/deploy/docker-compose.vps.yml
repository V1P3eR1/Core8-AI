# Core8 platform + Social Manager on a single VPS.
#   DOMAIN=srv2179387.hstgr.cloud docker compose -f deploy/docker-compose.vps.yml up -d --build
# Caddy terminates HTTPS (Let's Encrypt) and routes /api + /media -> backend, everything else -> frontend.
services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: [../backend/.env.production]
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "8000"
      DEV_MODE: "false"
      # Caddy is the only way in (backend is not published), so its X-Forwarded-For is trusted.
      # Without this every visitor shares one IP for login lockout and lead-form limits.
      TRUST_PROXY_HEADERS: "true"
      DB_PATH: /data/core8.db
      SOCIAL_MEDIA_DIR: /data/media-social
      SOCIAL_WORKER_INPROCESS: "false"
      MEDIA_BASE_URL: https://${DOMAIN}/media
      META_REDIRECT_URI: https://${DOMAIN}/api/instagram/oauth/callback
    volumes:
      - db_data:/data
      - media_data:/app/media
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "social.worker"]
    env_file: [../backend/.env.production]
    environment:
      DEV_MODE: "false"
      DB_PATH: /data/core8.db
      SOCIAL_MEDIA_DIR: /data/media-social
      MEDIA_BASE_URL: https://${DOMAIN}/media
    volumes:
      - db_data:/data
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      args:
        # Empty = same origin, so the dashboard works on every hostname Caddy serves (DOMAIN + EXTRA_DOMAINS).
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    expose: ["3000"]
    depends_on: [backend]
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      # Optional extra hostnames (space-separated), e.g. "app.core8-ai.com". Each needs a DNS A record to this VPS
      # before it is added, or Caddy keeps retrying its certificate.
      EXTRA_DOMAINS: ${EXTRA_DOMAINS:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    # core8-edge is shared with other stacks on this VPS (core8-lead-agent). install.sh creates it if missing.
    networks: [internal, core8-edge]

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  core8-edge:
    external: true
