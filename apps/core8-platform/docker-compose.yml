services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - db_data:/data
    env_file:
      - ./backend/.env.production
    environment:
      - BIND_HOST=0.0.0.0
      - BIND_PORT=8000
      - DEV_MODE=false
      - DB_PATH=/data/core8.db
    expose:
      - "8000"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
        NEXT_PUBLIC_BEARER_TOKEN: ""
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - internal

volumes:
  db_data:
  certbot_www:

networks:
  internal:
    driver: bridge
