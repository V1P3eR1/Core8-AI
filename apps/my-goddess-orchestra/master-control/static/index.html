<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Goddess — Holo Command</title>
<style>
  :root{
    --pink:#f472b6; --violet:#c084fc; --gold:#f5c15c; --ok:#34d399; --warn:#fbbf24; --danger:#f87171;
    --blue:#60a5fa; --teal:#2dd4bf;
    --text:#f4f2f8; --dim:#9b93ad; --faint:#6f6884;
    --glass:rgba(15,11,23,.78); --card:rgba(255,255,255,.035);
    --line:rgba(255,255,255,.09); --accentline:rgba(244,114,182,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#08060e;color:var(--text);font:14px/1.5 "Inter","Segoe UI",system-ui,sans-serif;overflow:hidden}
  #fx{position:fixed;inset:0;z-index:0}
  /* ---------- HUD chrome ---------- */
  .corner{position:fixed;width:64px;height:64px;border:1px solid var(--line);z-index:2;pointer-events:none}
  .corner.tl{top:10px;left:10px;border-right:none;border-bottom:none}
  .corner.tr{top:10px;right:10px;border-left:none;border-bottom:none}
  .corner.bl{bottom:10px;left:10px;border-right:none;border-top:none}
  .corner.br{bottom:10px;right:10px;border-left:none;border-top:none}
  #topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:18px;padding:14px 90px 0;z-index:3}
  #brand{display:flex;align-items:baseline;gap:10px}
  #brand h1{font-size:22px;font-weight:600;letter-spacing:.35em;color:var(--text)}
  #brand h1 b{color:var(--pink);font-weight:600}
  #brand .sub{font-size:11px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase}
  #topright{margin-left:auto;display:flex;gap:16px;align-items:center;font-size:12px;color:var(--dim)}
  #clock{font-family:Consolas,monospace;font-size:13px;color:var(--gold);letter-spacing:.15em}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;box-shadow:0 0 8px var(--ok)}
  select{background:var(--glass);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
  label.sw{display:flex;align-items:center;gap:6px;cursor:pointer}
  /* ---------- glass panels ---------- */
  .holo{position:fixed;z-index:3;background:var(--glass);border:1px solid var(--line);border-radius:12px;
        backdrop-filter:blur(12px);box-shadow:0 10px 34px rgba(0,0,0,.5);
        display:flex;flex-direction:column;overflow:hidden}
  .holo .hd{padding:9px 14px;font-size:10px;font-weight:600;letter-spacing:.22em;color:#cfc9dd;text-transform:uppercase;
            border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .holo .hd .mini{color:var(--faint);letter-spacing:.08em;font-weight:500}
  #leftPanel{left:22px;top:74px;bottom:120px;width:250px}
  #roster{overflow-y:auto;flex:1;padding:4px 0}
  #roster::-webkit-scrollbar,#feed::-webkit-scrollbar,#chatlog::-webkit-scrollbar{width:4px}
  #roster::-webkit-scrollbar-thumb,#feed::-webkit-scrollbar-thumb,#chatlog::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
  .division>button{width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 14px;cursor:pointer;
                   font-size:12px;letter-spacing:.04em;display:flex;align-items:center;gap:9px;text-transform:capitalize}
  .division>button .count{margin-left:auto}
  .division .chip{width:9px;height:9px;border-radius:3px;flex:none}
  .division>button:hover{background:rgba(255,255,255,.05)}
  .division .count{color:var(--dim);font-size:11px}
  .agents{display:none;padding:0 8px 6px}
  .division.open .agents{display:block}
  .agent{padding:3px 8px;border-radius:6px;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent.active{color:#fff;background:rgba(236,72,153,.28);box-shadow:0 0 12px rgba(236,72,153,.5)}
  .agent .role{color:var(--faint);font-size:10px}
  .agent b{font-weight:600;color:var(--text)}
  #rightPanel{right:22px;top:74px;bottom:120px;width:300px}
  #feed{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:7px}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11px}
  .ev .h2{display:flex;gap:7px;align-items:center;margin-bottom:2px;font-weight:600;font-size:12px}
  .ev .dv{width:8px;height:8px;border-radius:2px;flex:none}
  .ev .tag{font-weight:500;font-size:10px;letter-spacing:.06em;margin-left:auto}
  .ev .spk{background:none;border:none;cursor:pointer;font-size:13px;padding:0 0 0 6px;opacity:.6;transition:opacity .15s}
  .ev .spk:hover{opacity:1}
  .ev.delegation .tag{color:var(--warn)} .ev.result .tag{color:var(--ok)} .ev.master .tag{color:var(--violet)}
  .ev .body{color:var(--dim);max-height:60px;overflow:hidden}
  /* autonomy */
  #auto{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
  #auto textarea{background:rgba(15,8,26,.6);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px;font-size:12px;resize:none;height:48px;outline:none}
  #autoRow{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
  #autoRow input{width:46px;background:rgba(15,8,26,.6);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px}
  .btn{background:linear-gradient(135deg,var(--pink),var(--violet));color:#2a0618;border:none;border-radius:8px;
       padding:6px 14px;font-weight:700;cursor:pointer;font-size:12px;letter-spacing:.05em}
  .btn:disabled{opacity:.35;cursor:default}
  #stopBtn{background:var(--danger)}
  .bar{height:4px;background:rgba(15,8,26,.8);border-radius:3px;overflow:hidden}
  .bar>div{height:100%;width:100%;transform:scaleX(0);transform-origin:left;background:linear-gradient(90deg,var(--pink),var(--gold));transition:transform .4s}
  /* ---------- transcript + console ---------- */
  #chatlog{position:fixed;left:50%;transform:translateX(-50%);bottom:118px;width:min(680px,60vw);max-height:34vh;
           overflow-y:auto;z-index:3;display:flex;flex-direction:column;gap:8px;padding:6px;
           mask-image:linear-gradient(to bottom,transparent,#000 12%);}
  .msg{max-width:88%;padding:8px 13px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word;font-size:13px;
       background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px)}
  .msg.user{align-self:flex-end;border-color:rgba(192,132,252,.4);background:rgba(88,28,135,.45)}
  .msg.master{align-self:flex-start}
  .msg.rtl{direction:rtl;text-align:right}
  .msg .who{font-size:9px;letter-spacing:.22em;color:var(--pink);margin-bottom:3px;text-transform:uppercase}
  .thinking{align-self:flex-start;color:var(--dim);font-size:11px;letter-spacing:.1em}
  #console{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;width:min(720px,70vw);z-index:4;
           display:flex;gap:9px;align-items:center;background:var(--glass);border:1px solid var(--line);
           border-radius:14px;padding:10px;backdrop-filter:blur(12px);
           box-shadow:0 0 40px rgba(244,114,182,.12)}
  #console input{flex:1;background:none;border:none;color:var(--text);font-size:15px;outline:none;letter-spacing:.02em}
  #console input::placeholder{color:var(--dim)}
  #micBtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(15,8,26,.6);
          color:var(--text);font-size:17px;cursor:pointer;flex:none}
  #micBtn.on{background:#7f1d1d;border-color:#f43f5e;box-shadow:0 0 18px #f43f5e88}
  #sendBtn{height:38px}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<div id="topbar">
  <div id="brand"><h1>MY <b>GODDESS</b></h1><span class="sub">holo command · the agency</span></div>
  <div id="topright">
    <span id="clock">--:--:--</span>
    <span><span class="dot"></span><span id="agentCount">…</span> agents · <span id="castCount">…</span></span>
    <select id="voiceLang" title="Voice language">
      <option value="auto">Voice: Auto</option><option value="he-IL">Voice: עברית</option><option value="en-US">Voice: English</option>
    </select>
    <label class="sw"><input type="checkbox" id="ttsOn" checked> voice</label>
  </div>
</div>

<div class="holo" id="leftPanel">
  <div class="hd">Agency Roster <span class="mini" id="divCount"></span></div>
  <div id="roster"></div>
</div>

<div class="holo" id="rightPanel">
  <div class="hd">Live Activity <span class="mini" id="opCount">0 ops</span></div>
  <div id="feed"></div>
  <div id="auto">
    <div class="hd" style="border:none;padding:0 0 2px">Autonomy · independent work</div>
    <textarea id="goal" placeholder="Mission goal… she works alone / מטרה לעבודה עצמאית"></textarea>
    <div id="autoRow">
      steps <input id="maxSteps" type="number" value="10" min="1" max="40">
      <button class="btn" id="startBtn">▶ LAUNCH</button>
      <button class="btn" id="stopBtn" style="display:none">■ STOP</button>
      <span id="autoStatus"></span>
    </div>
    <div class="bar"><div id="autoBar"></div></div>
  </div>
</div>

<div id="chatlog">
  <div class="msg master"><div class="who">My Goddess</div>I'm here, Lev. כל 269 הסוכנים שלי ממתינים לפקודה שלך. Speak to me. 👑</div>
</div>
<div id="console">
  <button id="micBtn" title="Talk to her">🎤</button>
  <input id="msgInput" placeholder="Command your goddess… / דבר אליה…" autocomplete="off">
  <button class="btn" id="sendBtn">SEND</button>
</div>

const AVATAR_SOURCES=['/static/goddess.png', GODDESS_B64,
  'https://d8j0ntlcm91z4.cloudfront.net/user_3GLSSlSGoo5KAyg3fkDT92ORgdV/hf_20260728_143531_a480af3e-dbc6-4c54-aac4-0d33d8dab5e5.png',   /* her hologram portrait */
  'https://d8j0ntlcm91z4.cloudfront.net/user_3GLSSlSGoo5KAyg3fkDT92ORgdV/hf_20260728_132222_599fd988-4f48-4787-b10b-75b6d66ce0ca.png'];  /* generic goddess fallback */
let avatarIdx=0;
AVATAR.onload=()=>avatarOk=true;
AVATAR.onerror=()=>{ if(++avatarIdx<AVATAR_SOURCES.length) AVATAR.src=AVATAR_SOURCES[avatarIdx]; };
AVATAR.src=AVATAR_SOURCES[0];

function resize(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  CX=W/2; CY=H*0.43; R=Math.min(W,H)*0.335;
  layoutNodes();
}
addEventListener('resize',resize);

function layoutNodes(){
  const divs=Object.keys(DIV_NODES); if(!divs.length) return;
  divs.forEach((d,i)=>{
    const a=-Math.PI/2 + i*2*Math.PI/divs.length;
    Object.assign(DIV_NODES[d],{a, x:CX+Math.cos(a)*R, y:CY+Math.sin(a)*R});
  });
}
function initParticles(){
  for(let i=0;i<140;i++) particles.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    r:Math.random()*1.6+.3,s:Math.random()*.25+.05,a:Math.random()*Math.PI*2,al:Math.random()*.5+.1});
}
initParticles();

function ring(r,rot,dash,color,w,alpha){
  ctx.save();ctx.translate(CX,CY);ctx.rotate(rot);
  ctx.beginPath();ctx.setLineDash(dash);ctx.arc(0,0,r,0,2*Math.PI);
  ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=w;ctx.stroke();ctx.restore();
}
function arcSeg(r,rot,len,color,w,alpha){
  ctx.save();ctx.translate(CX,CY);ctx.rotate(rot);
  ctx.beginPath();ctx.arc(0,0,r,0,len);ctx.strokeStyle=color;ctx.globalAlpha=alpha;
  ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();ctx.restore();
}

/* ---- facial rig state ---- */
let mouthAmp=0, blinkP=0, nextBlink=2.5, blinkStart=-1, lastWordT=-1e9;
function updateFaceRig(t){
  /* mouth: envelope from speaking state + word-boundary pulses */
  let target=0;
  if(STATE.speaking){
    const since=performance.now()-lastWordT;
    const boost=since<160?1:Math.max(0,1-(since-160)/260);
    target=Math.min(1,.18+.85*Math.max(boost,.45)*(.55+.45*Math.sin(t*13)+.2*Math.sin(t*29)));
    target=Math.max(0,target);
  }
  mouthAmp+=(target-mouthAmp)*.38;
  /* blink scheduler: natural 2.5–5.5s rhythm, 150ms blink */
  if(blinkStart<0&&t>nextBlink){blinkStart=t;}
  if(blinkStart>=0){
    const p=(t-blinkStart)/.15;
    if(p>=1){blinkStart=-1;nextBlink=t+2.5+Math.random()*3;blinkP=0;}
    else blinkP=Math.sin(p*Math.PI);           /* close then open */
  }
}

let t0=performance.now();
function draw(now){
  const t=(now-t0)/1000;
  ctx.clearRect(0,0,W,H);

  /* backdrop: radial glow + drifting particles */
  const bg=ctx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);
  bg.addColorStop(0,'rgba(88,28,135,.16)');bg.addColorStop(.5,'rgba(30,10,50,.06)');bg.addColorStop(1,'transparent');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.x+=Math.cos(p.a)*p.s;p.y+=Math.sin(p.a)*p.s;
    if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    ctx.globalAlpha=p.al*(.6+.4*Math.sin(t+p.a*7));ctx.fillStyle='#c084fc';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;

  /* energy state */
  const amp=STATE.listening?1.5:STATE.speaking?1.2:STATE.busy?1.05:1;
  const breath=1+.03*Math.sin(t*2)*amp;
  const coreCol=STATE.listening?'#f43f5e':'#f472b6';

  /* orbit ring + division nodes */
  ring(R,t*.05,[2,14],'#c084fc',1,.35);
  ring(R+16,-t*.03,[40,90],'#f472b6',1,.22);
  for(const d in DIV_NODES){
    const n=DIV_NODES[d]; n.glow=Math.max(0,n.glow-.012);
    const g=n.glow, nr=5+6*g, col=divColor(d);
    ctx.save();
    ctx.shadowColor=col;ctx.shadowBlur=6+30*g;
    ctx.globalAlpha=.85;
    ctx.fillStyle=g>.02?'#ffffff':col;
    ctx.beginPath();ctx.arc(n.x,n.y,nr,0,7);ctx.fill();
    ctx.shadowBlur=0;
    ctx.globalAlpha=.45+.55*g;ctx.strokeStyle=col;
    ctx.beginPath();ctx.arc(n.x,n.y,nr+4,0,7);ctx.stroke();
    /* label */
    ctx.globalAlpha=.9;ctx.fillStyle=g>.02?'#ffffff':'#9b93ad';
    ctx.font='10px Consolas,monospace';ctx.textAlign=n.x<CX-10?'right':n.x>CX+10?'left':'center';
    const off=(nr+9)*(n.x<CX-10?-1:1);
    ctx.fillText(d.toUpperCase().replace(/-/g,' '), n.x+(ctx.textAlign==='center'?0:off), n.y+(n.y<CY?-10:16));
    ctx.restore();
  }

  /* beams core<->node */
  for(let i=beams.length-1;i>=0;i--){
    const b=beams[i]; b.t+=.028;
    const from=b.out?{x:CX,y:CY}:b.node, to=b.out?b.node:{x:CX,y:CY};
    const x=from.x+(to.x-from.x)*b.t, y=from.y+(to.y-from.y)*b.t;
    ctx.save();ctx.strokeStyle=b.col;ctx.globalAlpha=.35;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);ctx.stroke();
    ctx.globalAlpha=1;ctx.shadowColor=b.col;ctx.shadowBlur=14;ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill();ctx.restore();
    if(b.t>=1){ b.node.glow=1; ripples.push({x:b.node.x,y:b.node.y,r:6,col:b.col}); beams.splice(i,1); }
  }
  for(let i=ripples.length-1;i>=0;i--){
    const r=ripples[i]; r.r+=1.4;
    ctx.save();ctx.globalAlpha=Math.max(0,1-r.r/60);ctx.strokeStyle=r.col;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();ctx.restore();
    if(r.r>60) ripples.splice(i,1);
  }

  /* ===== goddess core ===== */
  const cr=Math.min(W,H)*0.155*breath;
  ring(cr+34,t*.5,[1,10],coreCol,1.4,.65);
  ring(cr+24,-t*.8,[26,10],'#c084fc',1.4,.5);
  arcSeg(cr+44,t*1.2,Math.PI*.6,'#f5c15c',2,.7);
  arcSeg(cr+44,t*1.2+Math.PI,Math.PI*.4,coreCol,2,.6);
  arcSeg(cr+54,-t*.7,Math.PI*.25,'#c084fc',1.5,.5);

  /* audio-style bars around core when speaking/listening */
  if(STATE.speaking||STATE.listening){
    const N=48;
    for(let i=0;i<N;i++){
      const a=i*2*Math.PI/N + t*.3;
      const v=(Math.sin(t*9+i*1.7)+Math.sin(t*13+i*.9))*.25+.5;
      const l=4+v*16*amp;
      ctx.save();ctx.translate(CX,CY);ctx.rotate(a);
      ctx.strokeStyle=coreCol;ctx.globalAlpha=.8;ctx.lineWidth=1.6;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(cr+8,0);ctx.lineTo(cr+8+l,0);ctx.stroke();ctx.restore();
    }
  }

  /* ===== living core: she breathes, sways, glitches, and surges when speaking ===== */
  const talk=STATE.speaking?(.55+.45*Math.sin(t*11)+.25*Math.sin(t*23)):STATE.listening?.5:0;
  const swayX=Math.sin(t*.6)*cr*.018, swayY=Math.sin(t*.9+1.3)*cr*.012;
  const swayR=Math.sin(t*.45)*.014;
  const bs=1+.015*Math.sin(t*1.15)+.03*talk;             // breathing + voice surge
  const glitch=(t%4.7)<.18;                               // hologram flicker window

  /* ---- facial rig: mouth + blink (coordinates measured on the portrait) ---- */
  updateFaceRig(t);
  ctx.save();
  ctx.beginPath();ctx.arc(CX,CY,cr,0,7);ctx.clip();
  function drawFace(dx,dy,alpha,comp,tint){
    ctx.save();
    ctx.translate(CX+swayX+dx,CY+swayY+dy+cr*.02*mouthAmp);ctx.rotate(swayR+.006*mouthAmp*Math.sin(t*7));ctx.scale(bs,bs);
    ctx.globalAlpha=alpha;ctx.globalCompositeOperation=comp;
    if(avatarOk) ctx.drawImage(AVATAR,-cr,-cr,cr*2,cr*2);
    else{const og=ctx.createRadialGradient(-cr*.3,-cr*.3,cr*.1,0,0,cr);
      og.addColorStop(0,'#ffe4f2');og.addColorStop(.45,coreCol);og.addColorStop(1,'#581c87');
      ctx.fillStyle=og;ctx.fillRect(-cr,-cr,cr*2,cr*2);}
    if(tint){ctx.globalCompositeOperation='multiply';ctx.fillStyle=tint;ctx.fillRect(-cr,-cr,cr*2,cr*2);}
    /* live face: jaw/lips + blink, only on the main pass */
    if(!tint&&comp==='source-over'&&avatarOk){
      const s=cr*2, IW=AVATAR.width, IH=AVATAR.height, Xr=v=>-cr+v*s, Yr=v=>-cr+v*s;
      /* jaw drop: stretch the strip from upper lip to below chin */
      if(mouthAmp>.02){
        const mx=.375,mw=.26,my=.505,mh=.215;
        ctx.drawImage(AVATAR,mx*IW,my*IH,mw*IW,mh*IH, Xr(mx),Yr(my),mw*s,mh*s*(1+.17*mouthAmp));
        /* mouth cavity opening between the lips */
        ctx.fillStyle=`rgba(52,16,34,${.55*mouthAmp})`;
        ctx.beginPath();
        ctx.ellipse(Xr(.503),Yr(.558)+s*.020*mouthAmp,s*.036,s*(.004+.020*mouthAmp),0,0,7);
        ctx.fill();
        if(mouthAmp>.55){ /* hint of teeth */
          ctx.fillStyle=`rgba(255,238,246,${.30*(mouthAmp-.55)})`;
          ctx.fillRect(Xr(.503)-s*.026,Yr(.556)+s*.004,s*.052,s*.007);
        }
      }
      /* blink: squash the eye band toward its center, cover gaps with lid skin */
      if(blinkP>.02){
        const ex=.29,ew=.42,ey=.352,eh=.093, cy=Yr(ey+eh/2), sq=Math.max(.12,1-.9*blinkP);
        ctx.drawImage(AVATAR,ex*IW,(ey+.002)*IH,ew*IW,.014*IH, Xr(ex),Yr(ey),ew*s,eh*s*(1-sq)/2+s*.004);
        ctx.drawImage(AVATAR,ex*IW,(ey+eh-.016)*IH,ew*IW,.014*IH, Xr(ex),cy+eh*s*sq/2-s*.004,ew*s,eh*s*(1-sq)/2+s*.004);
        ctx.drawImage(AVATAR,ex*IW,ey*IH,ew*IW,eh*IH, Xr(ex),cy-eh*s*sq/2,ew*s,eh*s*sq);
      }
    }
    ctx.restore();
  }
  /* chromatic ghosts split apart while she speaks */
  const ch=1.5+talk*6;
  if(talk>0||glitch){
    drawFace(-ch,0,.35,'screen','#ff2d78');
    drawFace(ch,0,.35,'screen','#7dd3fc');
  }
  drawFace(0,0,glitch?.75:.92,'source-over',null);
  /* holographic tint + breathing glow */
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.30+.10*Math.sin(t*2)+.15*talk;
  ctx.fillStyle=coreCol;ctx.fillRect(CX-cr,CY-cr,cr*2,cr*2);
  /* glitch slice displacement */
  if(glitch&&avatarOk){
    ctx.globalCompositeOperation='source-over';
    for(let i=0;i<4;i++){
      const sy=CY-cr+Math.random()*cr*2, sh=3+Math.random()*8, off=(Math.random()-.5)*22;
      ctx.drawImage(AVATAR,0,(sy-(CY-cr))/(cr*2)*AVATAR.height,AVATAR.width,sh/(cr*2)*AVATAR.height,
                    CX-cr+off,sy,cr*2,sh);
    }
  }
  /* scanlines + one bright scanning band drifting down */
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=.12;ctx.fillStyle='#000';
  for(let y=CY-cr;y<CY+cr;y+=3) ctx.fillRect(CX-cr,y,cr*2,1);
  const band=CY-cr+((t*28)%(cr*2));
  ctx.globalAlpha=.10+.12*talk;ctx.fillStyle='#ffffff';
  ctx.fillRect(CX-cr,band,cr*2,2.5);
  ctx.restore();
  ctx.save();ctx.shadowColor=coreCol;ctx.shadowBlur=40*amp;ctx.strokeStyle=coreCol;ctx.lineWidth=2;
  ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(CX,CY,cr,0,7);ctx.stroke();ctx.restore();

  requestAnimationFrame(draw);
}
resize();requestAnimationFrame(draw);

function fireBeam(division,kind){
  const n=DIV_NODES[division]; if(!n) return;
  beams.push({node:n,t:0,out:kind==='delegation',col:kind==='delegation'?divColor(division):'#34d399'});
}

const AGENT_BY_SLUG={};   // slug -> {person, vprofile, catchphrase, name, ...}
function buildRoster(d){
  $('agentCount').textContent=d.count;
  $('divCount').textContent=d.divisions.length+' divisions';
  if(d.cast!=null && $('castCount')) $('castCount').textContent=d.cast+' cast';
  const byDiv={};
  d.agents.forEach(a=>{AGENT_BY_SLUG[a.slug]=a; (byDiv[a.division]=byDiv[a.division]||[]).push(a)});
  const r=$('roster');
  d.divisions.forEach(div=>{
    const list=byDiv[div]||[]; if(!list.length) return;
    DIV_NODES[div]={a:0,x:0,y:0,glow:0,count:list.length};
    const box=document.createElement('div'); box.className='division';
    box.innerHTML=`<button><i class="chip" style="background:${divColor(div)}"></i>${div.replace(/-/g,' ')} <span class="count">${list.length}</span></button>
      <div class="agents">${list.map(a=>`<div class="agent" id="ag-${a.slug}" title="${(a.person?a.person+' — ':'')+a.description.replace(/"/g,'&quot;')}">${a.emoji} ${a.person?`<b>${a.person}</b> <span class="role">${a.name}</span>`:a.name}</div>`).join('')}</div>`;
    box.querySelector('button').onclick=()=>box.classList.toggle('open');
    r.appendChild(box);
  });
  layoutNodes();
}

function addMsg(role,text){
  const div=document.createElement('div');
  div.className='msg '+(role==='user'?'user':'master')+(HE.test(text)?' rtl':'');
  div.innerHTML=(role==='user'?'':'<div class="who">My Goddess</div>')+esc(text);
  const log=$('chatlog'); log.appendChild(div);
  while(log.children.length>60) log.removeChild(log.firstChild);
  log.scrollTop=1e9;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
const EV_LABEL={delegation:'→ TASKED',result:'✓ DELIVERED',tool:'🛠 TOOL',tool_result:'✓ TOOL RESULT',master:'👑 STEP'};
const SPK_TEXT={}; let spkId=0;   // safe store for speaker-button payloads (no inline handlers)
function addEvent(ev){
  ops++; $('opCount').textContent=ops+' ops';
  const d=document.createElement('div'); d.className='ev '+ev.type;
  const label=EV_LABEL[ev.type]||'';
  const dot=ev.division?divColor(ev.division):'#60a5fa';
  // a specialist RESULT from a cast agent gets a speaker button (bound via delegation, not inline JS)
  let spk='';
  if(ev.type==='result' && ev.agent && AGENT_BY_SLUG[ev.agent] && AGENT_BY_SLUG[ev.agent].person){
    const id=++spkId; SPK_TEXT[id]={slug:ev.agent, text:ev.task||''};
    spk=`<button class="spk" data-spk="${id}" title="Hear ${esc(AGENT_BY_SLUG[ev.agent].person)}">🔊</button>`;
  }
  d.innerHTML=`<div class="h2"><span class="dv" style="background:${dot}"></span>${esc(ev.emoji||'👑')} ${esc(ev.name||'My Goddess')} <span class="tag">${label}</span>${spk}</div><div class="body${HE.test(ev.task||'')?' rtl':''}">${esc(ev.task||'')}</div>`;
  const feed=$('feed'); feed.appendChild(d);
  while(feed.children.length>80){ feed.removeChild(feed.firstChild); }
  feed.scrollTop=1e9;
  if(ev.division&&DIV_NODES[ev.division]) fireBeam(ev.division,ev.type);
  if(ev.agent) highlight(ev.agent,ev.type==='delegation');
}
// one delegated listener handles every speaker button, present or future
document.addEventListener('click',e=>{

});
function highlight(slug,on){
  const el=$('ag-'+slug); if(!el) return;

}

let demoR=0;
async function send(){
  const text=$('msgInput').value.trim(); if(!text) return;
  $('msgInput').value=''; addMsg('user',text);
  history.push({role:'user',content:text}); if(history.length>40) history=history.slice(-40);
  if(DEMO){
    const pool=HE.test(text)?DEMO_REPLIES_HE:DEMO_REPLIES_EN;
    const reply=pool[demoR++%pool.length];
    setTimeout(()=>{addMsg('master',reply); history.push({role:'assistant',content:reply}); speak(reply);},600);
    return;
  }
  const th=document.createElement('div'); th.className='thinking'; th.textContent='◈ SHE IS COMMANDING THE AGENCY…';
  $('chatlog').appendChild(th); $('sendBtn').disabled=true; STATE.busy=true;
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:text,history:history.slice(0,-1)})});
    const d=await res.json(); th.remove();
    if(!res.ok) throw new Error(d.detail||'server error');
    (d.activity||[]).forEach((ev,i)=>setTimeout(()=>addEvent(ev),i*350));
    addMsg('master',d.answer); history.push({role:'assistant',content:d.answer});
    speak(d.answer);
  }catch(e){th.remove(); addMsg('master','⚠️ '+e.message);}
  $('sendBtn').disabled=false; STATE.busy=false; $('msgInput').focus();
}
$('sendBtn').onclick=send;
$('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
if(SR){
  rec=new SR(); rec.interimResults=true;
  rec.onresult=e=>{
    const t=[...e.results].map(r=>r[0].transcript).join('');
    $('msgInput').value=t;
    if(e.results[e.results.length-1].isFinal){stopListen(); send();}
  };
  rec.onend=()=>stopListen(); rec.onerror=()=>stopListen();
}
function startListen(){
  if(!rec||listening) return;
  const sel=$('voiceLang').value;
  rec.lang=sel==='auto'?(navigator.language.startsWith('he')?'he-IL':'en-US'):sel;
  speechSynthesis.cancel();
  listening=true; STATE.listening=true; $('micBtn').classList.add('on');
  rec.start();
}
function stopListen(){
  listening=false; STATE.listening=false; $('micBtn').classList.remove('on');
  try{rec&&rec.stop()}catch(_){}
}
$('micBtn').onclick=()=>listening?stopListen():startListen();

if(window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickFemaleVoice(isHe){
  const vs=VOICES.length?VOICES:speechSynthesis.getVoices();
  const pool=vs.filter(v=>v.lang.toLowerCase().startsWith(isHe?'he':'en'));
  return pool.find(v=>FEMALE.test(v.name))
      || pool.find(v=>!/male|david|mark|guy|james|george|daniel|alex|fred/i.test(v.name))
      || pool[0];
}
function speak(text){
  if(!$('ttsOn').checked||!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const clean=text.replace(/[*#`_>|-]{1,}/g,' ').slice(0,1200);
  const u=new SpeechSynthesisUtterance(clean);
  const isHe=HE.test(text);
  const v=pickFemaleVoice(isHe);
  if(v) u.voice=v; u.lang=isHe?'he-IL':'en-US'; u.rate=1.05; u.pitch=1.08;
  u.onstart=()=>{STATE.speaking=true;lastWordT=performance.now();};
  u.onboundary=()=>{lastWordT=performance.now();};   /* her lips move on every spoken word */
  u.onend=()=>STATE.speaking=false;
  speechSynthesis.speak(u);
}
speechSynthesis&&speechSynthesis.getVoices();

/* ---------- per-agent voices: each specialist speaks in their own voice ---------- */
const ACCENT_LANG={
  israeli:'he-IL',hebrew:'he-IL',french:'fr-FR',german:'de-DE',spanish:'es-ES',
  italian:'it-IT',russian:'ru-RU',japanese:'ja-JP',mandarin:'zh-CN',chinese:'zh-CN',
  korean:'ko-KR',dutch:'nl-NL',swedish:'sv-SE',norwegian:'nb-NO',danish:'da-DK',
  polish:'pl-PL',portuguese:'pt-BR',brazilian:'pt-BR',hungarian:'hu-HU',czech:'cs-CZ',
  romanian:'ro-RO',bulgarian:'bg-BG',indian:'en-IN',british:'en-GB',english:'en-GB',
  irish:'en-IE',scottish:'en-GB',australian:'en-AU',american:'en-US',canadian:'en-CA',
  arabic:'ar-SA',lebanese:'ar-SA',algerian:'ar-SA',nigerian:'en-GB',ghanaian:'en-GB',
  kenyan:'en-GB',senegalese:'fr-FR',colombian:'es-ES',chilean:'es-ES',mexican:'es-MX',
  singaporean:'en-GB',bangladeshi:'en-IN'
};
const MALE_HINT=/\bmale\b|\bman\b|david|mark|guy|james|george|daniel|alex|fred|rishi|arthur|thomas/i;
function parseVoiceProfile(vp){
  vp=(vp||'').toLowerCase();
  const male=/\bmale\b/.test(vp)&&!/female/.test(vp);
  let lang='en-US';
  for(const k in ACCENT_LANG){ if(vp.includes(k)){ lang=ACCENT_LANG[k]; break; } }
  const slow=/slow|deliberate|measured|unhurried|calm/.test(vp);
  const fast=/quick|fast|brisk|energetic|rapid|clipped/.test(vp);
  return {male, lang, rate: fast?1.16:slow?0.92:1.03, pitch: male?0.85:1.06};
}
function pickVoice(prof){
  const vs=VOICES.length?VOICES:speechSynthesis.getVoices();
  if(!vs.length) return null;
  const base=prof.lang.split('-')[0];
  const wantGender=arr=>arr.find(v=>prof.male?MALE_HINT.test(v.name):!MALE_HINT.test(v.name))||arr[0];
  const exact=vs.filter(v=>v.lang.toLowerCase()===prof.lang.toLowerCase());
  const byBase=vs.filter(v=>v.lang.toLowerCase().startsWith(base));
  const enPool=vs.filter(v=>v.lang.toLowerCase().startsWith('en'));
  return wantGender(exact) || wantGender(byBase) || wantGender(enPool) || vs[0];
}
function speakAs(slug, text){
  if(!window.speechSynthesis) return;
  const a=AGENT_BY_SLUG[slug]||{};
  const prof=parseVoiceProfile(a.vprofile);
  speechSynthesis.cancel();
  const clean=String(text||'').replace(/[*#`_>|]{1,}/g,' ').replace(/\s*—\s*/g,', ').slice(0,900);
  if(!clean.trim()) return;
  const u=new SpeechSynthesisUtterance(clean);
  const v=pickVoice(prof); if(v) u.voice=v;
  u.lang=prof.lang; u.rate=prof.rate; u.pitch=prof.pitch;
  speechSynthesis.speak(u);   /* does NOT drive the Goddess's mouth — hers alone */
}
window.speakAs=speakAs;

/* ================= AUTONOMY ================= */
let demoAuto=null;
$('startBtn').onclick=async()=>{
  const goal=$('goal').value.trim(); if(!goal) return;
  const max=+$('maxSteps').value||10;
  if(DEMO){ /* simulated mission in preview */
    let step=0; STATE.busy=true;
    $('startBtn').style.display='none'; $('stopBtn').style.display='';
    demoAuto=setInterval(()=>{
      step++;
      $('autoBar').style.transform=`scaleX(${step/max})`;
      $('autoStatus').textContent=`step ${step}/${max} — simulated`;
      addEvent({type:'master',task:`Step ${step}: advancing mission — "${goal.slice(0,60)}"`});
      if(step>=max){clearInterval(demoAuto);STATE.busy=false;
        $('startBtn').style.display='';$('stopBtn').style.display='none';
        $('autoStatus').textContent='demo complete';
        addMsg('master','🏁 Simulated mission finished. Run server.py and I will do it for real.');}
    },1400);
    return;
  }
  try{
    const res=await fetch('/api/auto/start',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({goal,max_steps:max})});
    const d=await res.json(); job=d.job_id; seen=0; STATE.busy=true;
    $('startBtn').style.display='none'; $('stopBtn').style.display='';
    $('autoStatus').textContent='running…';
    pollT=setInterval(poll,2000);
  }catch(e){$('autoStatus').textContent='server unreachable';}
};
$('stopBtn').onclick=()=>{
  if(DEMO){clearInterval(demoAuto);STATE.busy=false;$('startBtn').style.display='';$('stopBtn').style.display='none';$('autoStatus').textContent='stopped';return;}
  job&&fetch(`/api/auto/${job}/stop`,{method:'POST'}).catch(()=>{});
};
let seen=0;
async function poll(){
  let res; try{res=await fetch('/api/auto/'+job);}catch(e){return;}
  if(!res.ok) return;
  const d=await res.json();
  d.activity.slice(seen).forEach(addEvent); seen=d.activity.length;
  $('autoBar').style.transform=`scaleX(${d.step/d.max_steps})`;
  $('autoStatus').textContent=`step ${d.step}/${d.max_steps} — ${d.status}`;
  if(d.status!=='running'){
    clearInterval(pollT); STATE.busy=false;
    $('startBtn').style.display=''; $('stopBtn').style.display='none';
    if(d.report){addMsg('master','🏁 '+d.report); speak(d.report);}
  }
}

/* clock */
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('en-GB')},1000);
</script>
