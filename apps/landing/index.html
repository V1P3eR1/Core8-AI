<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Prototype: keep out of search engines until Lev approves the launch. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="" data-i18n-content="meta.description">
  <title>Core8-AI</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip"></a>
  <div class="draft" role="note" data-testid="draft-banner" data-i18n="draft.banner"></div>

  <header class="top">
    <a class="brand" href="#main" aria-label="Core8-AI"><img class="brand__mark" src="assets/logo-mark.svg" alt="" width="38" height="38" data-testid="logo"><span lang="en" dir="ltr">Core8-AI</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#control" data-i18n="nav.control"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#founder" data-i18n="nav.founder"></a>
      <a href="#faq" data-i18n="nav.faq"></a>
    </nav>
    <div class="top__right">
      <div class="lang" role="group" aria-label="Language / שפה">
        <button type="button" data-lang="he" lang="he" aria-pressed="true">עברית</button>
        <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
      </div>
      <a class="btn btn--primary btn--sm" href="#contact" data-i18n="nav.cta"></a>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="hero__text">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 data-i18n="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero__cta">
          <a class="btn btn--primary" href="#contact" data-i18n="hero.cta"></a>
          <a class="btn" href="#how" data-i18n="hero.cta2"></a>
        </div>
      </div>

      <figure class="mock" aria-labelledby="mock-cap" data-testid="mock">
        <figcaption id="mock-cap" class="mock__label" data-i18n="mock.label"></figcaption>
        <p class="mock__title" data-i18n="mock.title"></p>
        <div class="mock__item">
          <p class="mock__kind" data-i18n="mock.item1.kind"></p>
          <p data-i18n="mock.item1.text"></p>
          <div class="mock__actions" aria-hidden="true">
            <span class="pill pill--ok" data-i18n="mock.approve"></span><span class="pill" data-i18n="mock.edit"></span><span class="pill" data-i18n="mock.reject"></span>
          </div>
        </div>
        <div class="mock__item">
          <p class="mock__kind" data-i18n="mock.item2.kind"></p>
          <p data-i18n="mock.item2.text"></p>
          <div class="mock__actions" aria-hidden="true">
            <span class="pill pill--ok" data-i18n="mock.approve"></span><span class="pill" data-i18n="mock.edit"></span><span class="pill" data-i18n="mock.reject"></span>
          </div>
        </div>
        <p class="mock__log" data-i18n="mock.log"></p>
      </figure>
    </section>

    <section id="how" class="band">
      <h2 data-i18n="how.title"></h2>
      <ol class="steps">
        <li><h3 data-i18n="how.1.t"></h3><p data-i18n="how.1.d"></p></li>
        <li><h3 data-i18n="how.2.t"></h3><p data-i18n="how.2.d"></p></li>
        <li><h3 data-i18n="how.3.t"></h3><p data-i18n="how.3.d"></p></li>
        <li><h3 data-i18n="how.4.t"></h3><p data-i18n="how.4.d"></p></li>
      </ol>
    </section>

    <section id="control" class="band band--accent">
      <h2 data-i18n="control.title"></h2>
      <p class="lead" data-i18n="control.lead"></p>
      <ul class="grid">
        <li><h3 data-i18n="control.1.t"></h3><p data-i18n="control.1.d"></p></li>
        <li><h3 data-i18n="control.2.t"></h3><p data-i18n="control.2.d"></p></li>
        <li><h3 data-i18n="control.3.t"></h3><p data-i18n="control.3.d"></p></li>
        <li><h3 data-i18n="control.4.t"></h3><p data-i18n="control.4.d"></p></li>
      </ul>
    </section>

    <section id="process" class="band">
      <h2 data-i18n="process.title"></h2>
      <ol class="steps steps--line">
        <li><h3 data-i18n="process.1.t"></h3><p data-i18n="process.1.d"></p></li>
        <li><h3 data-i18n="process.2.t"></h3><p data-i18n="process.2.d"></p></li>
        <li><h3 data-i18n="process.3.t"></h3><p data-i18n="process.3.d"></p></li>
        <li><h3 data-i18n="process.4.t"></h3><p data-i18n="process.4.d"></p></li>
      </ol>
      <p class="note" data-i18n="process.price" data-testid="price-note"></p>
    </section>

    <section id="founder" class="band band--narrow">
      <h2 data-i18n="founder.title"></h2>
      <p class="lead" data-i18n="founder.body"></p>
    </section>

    <section id="faq" class="band band--narrow">
      <h2 data-i18n="faq.title"></h2>
      <details><summary data-i18n="faq.1.q"></summary><p data-i18n="faq.1.a"></p></details>
      <details><summary data-i18n="faq.2.q"></summary><p data-i18n="faq.2.a"></p></details>
      <details><summary data-i18n="faq.3.q"></summary><p data-i18n="faq.3.a"></p></details>
      <details><summary data-i18n="faq.4.q"></summary><p data-i18n="faq.4.a"></p></details>
    </section>

    <section id="contact" class="band band--narrow">
      <h2 data-i18n="form.title"></h2>
      <p class="lead" data-i18n="form.lead"></p>
      <form id="lead-form" class="form" novalidate data-testid="lead-form">
        <div class="field"><label for="f-name" data-i18n="form.name"></label><input id="f-name" name="name" type="text" maxlength="120" autocomplete="name" required></div>
        <div class="field"><label for="f-company" data-i18n="form.company"></label><input id="f-company" name="company" type="text" maxlength="120" autocomplete="organization"></div>
        <div class="row">
          <div class="field"><label for="f-email" data-i18n="form.email"></label><input id="f-email" name="email" type="email" maxlength="200" autocomplete="email" dir="ltr" aria-describedby="contact-hint"></div>
          <div class="field"><label for="f-phone" data-i18n="form.phone"></label><input id="f-phone" name="phone" type="tel" maxlength="30" autocomplete="tel" dir="ltr" aria-describedby="contact-hint"></div>
        </div>
        <p class="hint" id="contact-hint" data-i18n="form.contactHint"></p>
        <div class="field"><label for="f-message" data-i18n="form.message"></label><textarea id="f-message" name="message" rows="4" maxlength="2000"></textarea></div>
        <!-- Honeypot: hidden from people, tempting to bots. Matches the platform's lead endpoint. -->
        <div class="hp" aria-hidden="true"><label for="f-website">Website</label><input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <label class="consent"><input id="f-consent" name="consent" type="checkbox" required><span data-i18n="form.consent"></span></label>
        <button type="submit" class="btn btn--primary" data-i18n="form.submit" data-testid="submit"></button>
        <p class="status" id="form-status" role="status" aria-live="polite" data-testid="form-status"></p>
      </form>
      <p class="mail"><span data-i18n="contact.or"></span> <a id="contact-email" dir="ltr" data-testid="contact-email"></a></p>
    </section>
  </main>

  <footer class="footer">
    <p><span lang="en" dir="ltr">© Core8-AI</span></p>
    <p data-i18n="footer.note"></p>
  </footer>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
